name: app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  animated_theme_switcher: ^2.0.10
  auto_route: ^11.1.0
  bloc: ^9.2.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  data_table_2: ^2.7.2
  dio: ^5.8.0+1
  dotted_line: ^3.2.3
  equatable: ^2.0.7
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.0
  forui: ^0.17.0
  get_it: ^9.2.0
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  hydrated_bloc: ^10.1.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  retrofit: ^4.5.0
  retrofit_generator: ^10.2.1
  talker: ^5.1.9
  talker_bloc_logger: ^5.1.9
  talker_dio_logger: ^5.1.9
  talker_flutter: ^5.1.9
  talker_logger: ^5.1.9
  uuid: ^4.5.2
  window_manager: ^0.5.1

dev_dependencies:
  auto_route_generator: ^10.2.3
  build: ^4.0.3
  build_runner: ^2.10.4
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.5
  lean_builder: ^0.1.0-alpha.13

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/splash_image.png"
  branding: "assets/images/splash_branding.png"

  android: false
  ios: false
  web: true

flutter:
  uses-material-design: true

  assets:
    - ".env"

    - "assets/svg/som.svg"
    - "assets/svg/logo.svg"
    - "assets/svg/icon.svg"
    - "assets/svg/invert_icon.svg"

    - "assets/images/splash_image.png"
    - "assets/images/splash_branding.png"

    - "assets/icon/icon.png"

  fonts:
    - family: Manrope
      fonts:
        - asset: "assets/fonts/Manrope/Manrope-ExtraBold.ttf"
          weight: 800
        - asset: "assets/fonts/Manrope/Manrope-Bold.ttf"
          weight: 700
        - asset: "assets/fonts/Manrope/Manrope-SemiBold.ttf"
          weight: 600
        - asset: "assets/fonts/Manrope/Manrope-Medium.ttf"
          weight: 500
        - asset: "assets/fonts/Manrope/Manrope-Regular.ttf"
          weight: 400
        - asset: "assets/fonts/Manrope/Manrope-Light.ttf"
          weight: 300
        - asset: "assets/fonts/Manrope/Manrope-ExtraLight.ttf"
          weight: 200
